{% extends "lifeRecordApp/users/users_base.html" %}

{% block title %}パスワードリセット{% endblock %}

{% block content %}
<div class="auth-container">
  <h3>パスワードリセット</h3>
  <p>登録されているメールアドレスを入力してください。リセット用URLを送信します。</p>
  
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">送信</button>
  </form>
</div>
{% endblock %}
