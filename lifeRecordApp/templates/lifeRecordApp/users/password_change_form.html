{% extends "lifeRecordApp/users/users_base.html" %}

{% block title %}パスワード変更{% endblock %}

{% block content %}
<div class="pw-change-container">
  <h1>パスワード変更</h1>

  <form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">パスワードを変更する</button>
  </form>

  <div class="back-wrapper">
    <button class="back-btn">
      <a href="{% url 'user_update' request.user.id %}">ユーザー編集画面へ戻る</a>
    </button>
  </div>
</div>
{% endblock %}
